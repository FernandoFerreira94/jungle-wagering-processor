x-app: &app
  build: .
  environment: &app-env
    PORT: "3000"
    DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
    AWS_ENDPOINT_URL: http://localstack:4566
    AWS_REGION: us-east-1
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
  depends_on:
    migrate:
      condition: service_completed_successfully
    localstack:
      condition: service_healthy
  restart: unless-stopped
  stop_grace_period: 30s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports: ["5432:5432"]
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 2s
      retries: 30

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs
      SQS_ENDPOINT_STRATEGY: path
    ports: ["4566:4566"]
    volumes:
      - ./localstack/init/ready.d:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name test-wager-events.fifo"]
      interval: 2s
      retries: 60

  migrate:
    build: .
    command: ["bun", "scripts/migrate.ts", "up"]
    environment:
      DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
    depends_on:
      postgres:
        condition: service_healthy

  app-1:
    <<: *app
    ports: ["3001:3000"]
  app-2:
    <<: *app
    ports: ["3002:3000"]
  app-3:
    <<: *app
    ports: ["3003:3000"]

  # Opcional, fora da entrega: tela para testar à mão. Sobe com --profile playground.
  playground:
    <<: *app
    profiles: ["playground"]
    command: ["bun", "playground/server.ts"]
    environment:
      <<: *app-env
      PORT: "8080"
    volumes:
      - ./playground:/app/playground:ro
    depends_on:
      app-1: { condition: service_started }
      app-2: { condition: service_started }
      app-3: { condition: service_started }
    ports: ["8080:8080"]
